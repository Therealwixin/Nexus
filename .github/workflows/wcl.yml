name: Verify Warcraft Logs
on:
  push:
    branches: [main]
    paths: ['tools/wcl_public.py', '.github/workflows/wcl.yml']
  workflow_dispatch:
    inputs:
      collect_guides:
        description: 'Collect anonymous ranked gear evidence for 40 specs, raid and M+ (one page each)'
        type: boolean
        default: false
      discover_world:
        description: 'Discover current expansion zones and native journal encounter IDs'
        type: boolean
        default: false
      encounter_id:
        description: 'Optional WCL encounter ID (0 = authentication/quota probe only)'
        default: '0'
        required: true
permissions:
  contents: read
concurrency:
  group: nexus-wcl-reader
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        if: inputs.encounter_id != '0'
        with:
          path: .cache/wcl
          key: wcl-v1-${{ inputs.encounter_id }}-${{ github.run_id }}
          restore-keys: wcl-v1-${{ inputs.encounter_id }}-
      - name: Verify public API and optional anonymous sample
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          WCL_DISCOVER_WORLD: ${{ inputs.discover_world }}
          WCL_COLLECT_GUIDES: ${{ inputs.collect_guides }}
          WCL_AUDIT_SCHEMA: ${{ github.event_name == 'push' }}
          ENCOUNTER_ID: ${{ inputs.encounter_id || '0' }}
        run: python tools/wcl_public.py --encounter "$ENCOUNTER_ID"
      - uses: actions/upload-artifact@v7
        with:
          name: Nexus-WCL-public-sample
          path: build/wcl/*
          if-no-files-found: error
