name: Refresh weekly WCL evidence
on:
  schedule:
    # Cheap daily due check; collect only weekly, or retry an unfinished run.
    - cron: '47 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexus-wcl-api
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      due: ${{ steps.cadence.outputs.due }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Weekly interval
        id: cadence
        env:
          EVENT_KIND: ${{ github.event_name }}
        run: python tools/wcl_release.py due
      - uses: actions/cache/restore@v6
        if: steps.cadence.outputs.due == 'true'
        with:
          path: build/wcl/checkpoint.json
          key: wcl-summary-v3-${{ hashFiles('tools/wcl_public.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: wcl-summary-v3-${{ hashFiles('tools/wcl_public.py') }}-
      - name: Collect or resume anonymous seasonal evidence
        if: steps.cadence.outputs.due == 'true'
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
          WCL_WAIT_FOR_QUOTA: 'true'
        run: python tools/wcl_public.py --collect-guides
      - name: Persist completed summaries even after a failed collection
        if: always() && steps.cadence.outputs.due == 'true' && hashFiles('build/wcl/checkpoint.json') != ''
        uses: actions/cache/save@v6
        with:
          path: build/wcl/checkpoint.json
          key: wcl-summary-v3-${{ hashFiles('tools/wcl_public.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v7
        if: success() && steps.cadence.outputs.due == 'true'
        with:
          name: Nexus-completed-WCL
          path: build/wcl/wcl-snapshot.json
          if-no-files-found: error
  publish:
    needs: collect
    if: needs.collect.result == 'success' && needs.collect.outputs.due == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Only the short write/test phase shares the daily publication lock.
    concurrency:
      group: nexus-data-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: Nexus-completed-WCL
          path: build/wcl
      - run: python tools/wcl_release.py stage
      - run: python -m pip install lupa==2.8
      - run: python tools/test_wcl.py
      - run: python tools/test_lean.py
      - run: python tools/data_report.py
      - name: Save validated weekly evidence for the next daily addon build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Nexus/WCLData.lua data/wcl-snapshot.json DATA-SOURCES.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh weekly anonymous WCL evidence'
          git push origin "HEAD:${GITHUB_REF_NAME}"
