name: Validate Nexus
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install lupa==2.8
      - run: python tools/refresh_gear.py --validate-only
      - run: python tools/test_lean.py
      - run: python tools/test_stats.py
      - run: python tools/test_maintenance.py
      - run: python tools/test_meta.py
      - run: python tools/test_wcl.py
      - run: python tools/test_guides.py
      - run: python tools/test_alternatives.py
      - run: python tools/package.py --output dist
      - uses: actions/upload-artifact@v7
        with:
          name: Nexus-tested-build
          path: dist/*.zip
          if-no-files-found: error

