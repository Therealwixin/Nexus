name: Release Nexus
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: nexus-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install lupa==2.8
      - name: Set tagged version
        env:
          BUILD_TAG: ${{ github.ref_name }}
        run: python tools/set_version.py "${BUILD_TAG#v}"
      - run: python tools/refresh_gear.py --validate-only
      - run: python tools/test_lean.py
      - run: python tools/test_maintenance.py
      - run: python tools/test_meta.py
      - run: python tools/test_wcl.py
      - run: python tools/test_guides.py
      - name: Check publishing configuration
        if: vars.CURSEFORGE_PUBLISH_ENABLED == 'true'
        env:
          PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python tools/check_publish.py
      - name: Package without publishing
        if: vars.CURSEFORGE_PUBLISH_ENABLED != 'true'
        uses: BigWigsMods/packager@v2
        with:
          args: -d -w 0 -a 0
      - name: Publish configured project
        if: vars.CURSEFORGE_PUBLISH_ENABLED == 'true'
        uses: BigWigsMods/packager@v2
        with:
          args: -p ${{ vars.CURSEFORGE_PROJECT_ID }} -w 0 -a 0
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: Nexus-release-build
          path: .release/*.zip
          include-hidden-files: true
          if-no-files-found: error

