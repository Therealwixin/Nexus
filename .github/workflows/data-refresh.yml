name: Refresh Nexus data
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nexus-data-publish
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Daily interval
        id: cadence
        env:
          EVENT_KIND: ${{ github.event_name }}
        run: python tools/data_release.py due
      - name: Collect complete candidate
        if: steps.cadence.outputs.due == 'true'
        run: python tools/refresh_gear.py
      - name: Refresh publication base
        if: steps.cadence.outputs.due == 'true'
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git merge --ff-only "origin/${GITHUB_REF_NAME}"
      - name: Stage complete candidate
        if: steps.cadence.outputs.due == 'true'
        run: python tools/data_release.py stage
      - name: Install test runtime
        if: steps.cadence.outputs.due == 'true'
        run: python -m pip install lupa==2.8
      - name: Document actual coverage
        if: steps.cadence.outputs.due == 'true'
        run: python tools/data_report.py
      - name: Test staged snapshot
        if: steps.cadence.outputs.due == 'true'
        run: |
          python tools/refresh_gear.py --validate-only
          python tools/test_lean.py
          python tools/test_stats.py
          python tools/test_maintenance.py
          python tools/test_meta.py
          python tools/test_guides.py
          python tools/test_alternatives.py
          python tools/test_wcl.py
      - name: Save verified data revision
        if: steps.cadence.outputs.due == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Nexus/Data.lua Nexus/MetaData.lua Nexus/GuideData.lua Nexus/SourceStatus.lua Nexus/Nexus.toc data/snapshot.json data/meta-snapshot.json data/guide-snapshot.json data/source-status.json DATA-SOURCES.md
          git commit -m 'Refresh verified Nexus snapshots'
          version=$(python tools/data_release.py version)
          git tag -a "v$version" -m "Nexus data $version"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "v$version"
      - name: Check publishing configuration
        if: steps.cadence.outputs.due == 'true' && vars.CURSEFORGE_PUBLISH_ENABLED == 'true'
        env:
          PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python tools/check_publish.py
      - name: Package data revision without publishing
        if: steps.cadence.outputs.due == 'true' && vars.CURSEFORGE_PUBLISH_ENABLED != 'true'
        uses: BigWigsMods/packager@v2
        with:
          args: -d -w 0 -a 0
      - name: Publish validated data revision
        if: steps.cadence.outputs.due == 'true' && vars.CURSEFORGE_PUBLISH_ENABLED == 'true'
        uses: BigWigsMods/packager@v2
        with:
          args: -p ${{ vars.CURSEFORGE_PROJECT_ID }} -w 0 -a 0
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        if: steps.cadence.outputs.due == 'true'
        with:
          name: Nexus-data-build
          path: .release/*.zip
          include-hidden-files: true
          if-no-files-found: error

