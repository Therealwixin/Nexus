name: Refresh Nexus data
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nexus-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_DATA_REFRESH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Three-day interval
        id: cadence
        env:
          EVENT_KIND: ${{ github.event_name }}
        run: python tools/data_release.py due
      - name: Collect complete candidate
        if: steps.cadence.outputs.due == 'true'
        run: python tools/refresh_gear.py
      - name: Collect anonymous WCL evidence
        if: steps.cadence.outputs.due == 'true'
        env:
          WCL_CLIENT_ID: ${{ secrets.WCL_CLIENT_ID }}
          WCL_CLIENT_SECRET: ${{ secrets.WCL_CLIENT_SECRET }}
        run: python tools/wcl_public.py --collect-guides --guide-snapshot build/candidate/guide-snapshot.json
      - name: Stage complete candidate
        if: steps.cadence.outputs.due == 'true'
        run: python tools/data_release.py stage
      - name: Install test runtime
        if: steps.cadence.outputs.due == 'true'
        run: python -m pip install lupa==2.8
      - name: Test staged snapshot
        if: steps.cadence.outputs.due == 'true'
        run: |
          python tools/refresh_gear.py --validate-only
          python tools/test_lean.py
          python tools/test_maintenance.py
          python tools/test_meta.py
          python tools/test_guides.py
          python tools/test_wcl.py
      - name: Save verified data revision
        if: steps.cadence.outputs.due == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Nexus/Data.lua Nexus/MetaData.lua Nexus/GuideData.lua Nexus/WCLData.lua Nexus/Nexus.toc data/snapshot.json data/meta-snapshot.json data/guide-snapshot.json data/wcl-snapshot.json
          git commit -m 'Refresh verified Nexus snapshots'
          version=$(python tools/data_release.py version)
          git tag -a "v$version" -m "Nexus data $version"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "v$version"
      - name: Check publishing configuration
        if: steps.cadence.outputs.due == 'true' && vars.CURSEFORGE_PUBLISH_ENABLED == 'true'
        env:
          PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python tools/check_publish.py
      - name: Package data revision without publishing
        if: steps.cadence.outputs.due == 'true' && vars.CURSEFORGE_PUBLISH_ENABLED != 'true'
        uses: BigWigsMods/packager@v2
        with:
          args: -d -w 0 -a 0
      - name: Publish validated data revision
        if: steps.cadence.outputs.due == 'true' && vars.CURSEFORGE_PUBLISH_ENABLED == 'true'
        uses: BigWigsMods/packager@v2
        with:
          args: -p ${{ vars.CURSEFORGE_PROJECT_ID }} -w 0 -a 0
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        if: steps.cadence.outputs.due == 'true'
        with:
          name: Nexus-data-build
          path: .release/*.zip
          include-hidden-files: true
          if-no-files-found: error

